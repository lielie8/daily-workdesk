<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="一个只显示当前行动、今日三项、七天安排和随手记录的极简个人工作台。">
  <title>今日工作台</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111827'/%3E%3Cpath d='M18 33l9 9 20-22' fill='none' stroke='%237dd3fc' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d18;
      --panel: rgba(18, 26, 43, .84);
      --panel-strong: #151f34;
      --line: rgba(148, 163, 184, .17);
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #7dd3fc;
      --blue-strong: #38bdf8;
      --lime: #bef264;
      --amber: #fbbf24;
      --danger: #fb7185;
      --shadow: 0 22px 70px rgba(0, 0, 0, .28);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% -10%, rgba(56, 189, 248, .16), transparent 30rem),
        radial-gradient(circle at 95% 5%, rgba(190, 242, 100, .07), transparent 24rem),
        var(--bg);
      line-height: 1.55;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 38px 0 72px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
    .eyebrow { color: var(--blue); font-size: .78rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 3px 0 0; font-size: clamp(2rem, 5vw, 4.35rem); line-height: .98; letter-spacing: -.055em; }
    #dateLine { color: var(--muted); text-align: right; font-size: .95rem; }

    .layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr); gap: 18px; align-items: start; }
    .stack { display: grid; gap: 18px; }
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      overflow: hidden;
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 22px 0; }
    .card-title { margin: 0; font-size: .84rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
    .hint { font-size: .78rem; color: var(--muted); }

    .now { padding: 28px; min-height: 330px; position: relative; isolation: isolate; }
    .now::after {
      content: ""; position: absolute; width: 220px; height: 220px; right: -80px; top: -90px;
      border-radius: 50%; background: rgba(56, 189, 248, .13); filter: blur(4px); z-index: -1;
    }
    .now-label { display: flex; align-items: center; gap: 9px; color: var(--blue); font-size: .82rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--blue-strong); box-shadow: 0 0 0 6px rgba(56, 189, 248, .1); }
    .now input {
      display: block; width: 100%; border: 0; outline: 0; color: var(--text); background: transparent;
      border-bottom: 1px solid transparent; transition: border-color .2s;
    }
    .now input:focus { border-color: rgba(125, 211, 252, .35); }
    #focusTask { margin-top: 26px; padding: 0 0 12px; font-size: clamp(1.85rem, 4vw, 3.25rem); font-weight: 750; line-height: 1.12; letter-spacing: -.04em; }
    #focusTask::placeholder { color: #64748b; }
    .focus-fields { margin-top: 31px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { padding: 15px 16px; border: 1px solid var(--line); background: rgba(8, 13, 24, .44); border-radius: 15px; }
    .field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: .75rem; }
    .field input { font-size: .95rem; padding: 0; }
    .now-actions { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
    .primary, .ghost, .icon-btn {
      border: 0; cursor: pointer; transition: transform .16s, background .16s, opacity .16s;
    }
    .primary:hover, .ghost:hover, .icon-btn:hover { transform: translateY(-1px); }
    .primary { padding: 11px 16px; border-radius: 12px; background: var(--blue); color: #082032; font-weight: 800; }
    .ghost { padding: 10px 13px; border-radius: 11px; background: rgba(148, 163, 184, .09); color: var(--muted); }
    .status { margin-left: auto; color: var(--lime); font-size: .83rem; min-height: 1.3em; }

    .today-list { padding: 13px 18px 19px; display: grid; gap: 9px; }
    .today-row { display: grid; grid-template-columns: 42px 1fr; gap: 12px; align-items: center; padding: 12px; border-radius: 15px; background: rgba(8, 13, 24, .38); border: 1px solid transparent; }
    .today-row:focus-within { border-color: rgba(125, 211, 252, .28); }
    .check { width: 42px; height: 42px; border-radius: 13px; border: 1px solid var(--line); background: rgba(148, 163, 184, .06); cursor: pointer; color: transparent; font-weight: 900; }
    .check.done { color: #08111f; background: var(--lime); border-color: var(--lime); }
    .today-copy label { display: block; color: var(--muted); font-size: .73rem; margin-bottom: 3px; }
    .today-copy input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 1rem; }
    .today-row.completed input { color: #64748b; text-decoration: line-through; }

    .week-list, .inbox-list { list-style: none; margin: 0; padding: 13px 18px 19px; display: grid; gap: 8px; }
    .week-item, .inbox-item { display: grid; align-items: center; gap: 10px; min-height: 46px; padding: 9px 10px; border-bottom: 1px solid var(--line); }
    .week-item { grid-template-columns: 74px 1fr auto; }
    .inbox-item { grid-template-columns: 1fr auto; }
    .week-date { color: var(--amber); font-size: .78rem; font-variant-numeric: tabular-nums; }
    .item-text { overflow-wrap: anywhere; }
    .icon-btn { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: transparent; color: #64748b; }
    .icon-btn:hover { background: rgba(251, 113, 133, .1); color: var(--danger); }
    .empty { padding: 18px 22px 24px; color: #64748b; font-size: .9rem; }

    .quick-form { display: grid; grid-template-columns: 120px 1fr auto; gap: 8px; padding: 14px 18px 19px; }
    .quick-form.inbox { grid-template-columns: 1fr auto; }
    .quick-form input { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; color: var(--text); background: rgba(8, 13, 24, .55); outline: none; }
    .quick-form input:focus { border-color: rgba(125, 211, 252, .48); }
    .quick-form button { min-width: 44px; }

    .footer-note { margin-top: 22px; color: #64748b; font-size: .78rem; text-align: center; }
    dialog { width: min(560px, calc(100% - 30px)); border: 1px solid var(--line); border-radius: 22px; color: var(--text); background: #111a2c; box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(2, 6, 23, .82); backdrop-filter: blur(4px); }
    .dialog-inner { padding: 24px; }
    .dialog-inner h2 { margin: 0 0 10px; }
    .dialog-inner p { color: var(--muted); }
    .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    body.focus-mode .layout > .stack:last-child, body.focus-mode .today-card, body.focus-mode header, body.focus-mode .footer-note { display: none; }
    body.focus-mode .layout { display: block; max-width: 860px; margin: 9vh auto 0; }
    body.focus-mode .now { min-height: 520px; display: flex; flex-direction: column; justify-content: center; }

    @media (max-width: 820px) {
      .shell { width: min(100% - 22px, 700px); padding-top: 24px; }
      header { align-items: start; }
      #dateLine { font-size: .82rem; }
      .layout { grid-template-columns: 1fr; }
      .focus-fields { grid-template-columns: 1fr; }
      .now { min-height: 0; padding: 22px; }
      .quick-form { grid-template-columns: 104px 1fr auto; }
    }
    @media (max-width: 520px) {
      header { display: block; }
      #dateLine { margin-top: 10px; text-align: left; }
      .quick-form { grid-template-columns: 1fr auto; }
      .quick-form input[type="date"] { grid-column: 1 / -1; }
      .week-item { grid-template-columns: 62px 1fr auto; }
      .now-actions { flex-wrap: wrap; }
      .status { width: 100%; margin: 2px 0 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">Personal cockpit</div>
        <h1>今天，只推进一件事。</h1>
      </div>
      <div id="dateLine"></div>
    </header>

    <div class="layout">
      <section class="stack">
        <article class="card now" aria-labelledby="nowTitle">
          <div class="now-label" id="nowTitle"><span class="pulse"></span>现在做</div>
          <input id="focusTask" autocomplete="off" placeholder="写下此刻唯一要推进的任务">
          <div class="focus-fields">
            <div class="field">
              <label for="doneWhen">做到这里就停</label>
              <input id="doneWhen" autocomplete="off" placeholder="例：独立解释DID并做对一道题">
            </div>
            <div class="field">
              <label for="resumeAt">下次从这里继续</label>
              <input id="resumeAt" autocomplete="off" placeholder="例：parallel trends 第2个例子">
            </div>
          </div>
          <div class="now-actions">
            <button class="primary" id="focusButton" type="button">进入专注</button>
            <button class="ghost" id="clearFocus" type="button">完成并清空</button>
            <span class="status" id="saveStatus" aria-live="polite"></span>
          </div>
        </article>

        <article class="card today-card" aria-labelledby="todayTitle">
          <div class="card-head">
            <h2 class="card-title" id="todayTitle">今天最多三项</h2>
            <span class="hint">点方块即可完成</span>
          </div>
          <div class="today-list" id="todayList"></div>
        </article>
      </section>

      <aside class="stack">
        <section class="card" aria-labelledby="weekTitle">
          <div class="card-head">
            <h2 class="card-title" id="weekTitle">最近七天</h2>
            <span class="hint">只放有日期的事</span>
          </div>
          <ul class="week-list" id="weekList"></ul>
          <form class="quick-form" id="weekForm">
            <input type="date" id="weekDate" aria-label="日期" required>
            <input id="weekText" aria-label="安排内容" placeholder="考试、截止日期或固定安排" autocomplete="off" required>
            <button class="primary" type="submit" aria-label="添加安排">＋</button>
          </form>
        </section>

        <section class="card" aria-labelledby="inboxTitle">
          <div class="card-head">
            <h2 class="card-title" id="inboxTitle">随手放这里</h2>
            <span class="hint">先记下，不分类</span>
          </div>
          <ul class="inbox-list" id="inboxList"></ul>
          <form class="quick-form inbox" id="inboxForm">
            <input id="inboxText" aria-label="随手记录" placeholder="一个想法、任务或资料" autocomplete="off" required>
            <button class="primary" type="submit" aria-label="添加记录">＋</button>
          </form>
        </section>
      </aside>
    </div>
    <p class="footer-note">内容只保存在当前浏览器。系统是否有效，只看你能不能在30秒内开始。</p>
  </main>

  <dialog id="finishDialog">
    <div class="dialog-inner">
      <h2>这件事完成了吗？</h2>
      <p>如果只是暂时停下，先写好“下次从哪里继续”；如果确实完成，再清空当前任务。</p>
      <div class="dialog-actions">
        <button class="ghost" id="cancelFinish" type="button">还没，保留</button>
        <button class="primary" id="confirmFinish" type="button">完成，清空</button>
      </div>
    </div>
  </dialog>

  <script>
    const STORE_KEY = 'hui-workbench-v1';
    const defaults = {
      focusTask: '', doneWhen: '', resumeAt: '',
      today: [
        { label: '主任务', text: '', done: false },
        { label: '英语保底', text: '', done: false },
        { label: '生活事项', text: '', done: false }
      ],
      week: [], inbox: []
    };

    const load = () => {
      try { return { ...defaults, ...JSON.parse(localStorage.getItem(STORE_KEY) || '{}') }; }
      catch { return structuredClone(defaults); }
    };
    let state = load();
    let saveTimer;
    const $ = (id) => document.getElementById(id);

    function save(message = '已保存') {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      $('saveStatus').textContent = message;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => $('saveStatus').textContent = '', 1300);
    }

    function bindText(id, key) {
      const el = $(id);
      el.value = state[key] || '';
      el.addEventListener('input', () => { state[key] = el.value; save(); });
    }

    function renderToday() {
      $('todayList').innerHTML = '';
      state.today.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'today-row' + (item.done ? ' completed' : '');
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'check' + (item.done ? ' done' : '');
        button.textContent = '✓';
        button.setAttribute('aria-label', item.done ? `将${item.label}标记为未完成` : `完成${item.label}`);
        button.addEventListener('click', () => { state.today[index].done = !state.today[index].done; save(); renderToday(); });
        const copy = document.createElement('div');
        copy.className = 'today-copy';
        const label = document.createElement('label');
        label.textContent = item.label;
        const input = document.createElement('input');
        input.value = item.text;
        input.placeholder = index === 0 ? '今天唯一的主线' : index === 1 ? '一次短口语或听力' : '没有就留空';
        input.addEventListener('input', () => { state.today[index].text = input.value; save(); });
        copy.append(label, input); row.append(button, copy); $('todayList').append(row);
      });
    }

    function localDate(dateString) {
      const d = new Date(dateString + 'T12:00:00');
      return `${d.getMonth() + 1}/${d.getDate()} 周${'日一二三四五六'[d.getDay()]}`;
    }

    function renderWeek() {
      const list = $('weekList'); list.innerHTML = '';
      const items = state.week.slice().sort((a, b) => a.date.localeCompare(b.date));
      if (!items.length) { list.innerHTML = '<li class="empty">暂无安排。只添加真正有日期的事情。</li>'; return; }
      items.forEach((item) => {
        const li = document.createElement('li'); li.className = 'week-item';
        const date = document.createElement('span'); date.className = 'week-date'; date.textContent = localDate(item.date);
        const text = document.createElement('span'); text.className = 'item-text'; text.textContent = item.text;
        const del = document.createElement('button'); del.type = 'button'; del.className = 'icon-btn'; del.textContent = '×'; del.setAttribute('aria-label', `删除${item.text}`);
        del.addEventListener('click', () => { state.week = state.week.filter(x => x.id !== item.id); save(); renderWeek(); });
        li.append(date, text, del); list.append(li);
      });
    }

    function renderInbox() {
      const list = $('inboxList'); list.innerHTML = '';
      if (!state.inbox.length) { list.innerHTML = '<li class="empty">脑子里冒出来的事先放这里。</li>'; return; }
      state.inbox.forEach((item) => {
        const li = document.createElement('li'); li.className = 'inbox-item';
        const text = document.createElement('span'); text.className = 'item-text'; text.textContent = item.text;
        const del = document.createElement('button'); del.type = 'button'; del.className = 'icon-btn'; del.textContent = '×'; del.setAttribute('aria-label', `删除${item.text}`);
        del.addEventListener('click', () => { state.inbox = state.inbox.filter(x => x.id !== item.id); save(); renderInbox(); });
        li.append(text, del); list.append(li);
      });
    }

    bindText('focusTask', 'focusTask'); bindText('doneWhen', 'doneWhen'); bindText('resumeAt', 'resumeAt');
    renderToday(); renderWeek(); renderInbox();

    const today = new Date();
    $('dateLine').textContent = new Intl.DateTimeFormat('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' }).format(today);
    const maxDate = new Date(today); maxDate.setDate(maxDate.getDate() + 7);
    $('weekDate').min = today.toISOString().slice(0, 10); $('weekDate').max = maxDate.toISOString().slice(0, 10);

    $('weekForm').addEventListener('submit', (event) => {
      event.preventDefault();
      state.week.push({ id: crypto.randomUUID(), date: $('weekDate').value, text: $('weekText').value.trim() });
      $('weekText').value = ''; save('已加入七天安排'); renderWeek();
    });

    $('inboxForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const text = $('inboxText').value.trim(); if (!text) return;
      state.inbox.unshift({ id: crypto.randomUUID(), text }); $('inboxText').value = ''; save('已收好'); renderInbox();
    });

    $('focusButton').addEventListener('click', () => {
      document.body.classList.toggle('focus-mode');
      $('focusButton').textContent = document.body.classList.contains('focus-mode') ? '退出专注' : '进入专注';
    });
    $('clearFocus').addEventListener('click', () => $('finishDialog').showModal());
    $('cancelFinish').addEventListener('click', () => $('finishDialog').close());
    $('confirmFinish').addEventListener('click', () => {
      state.focusTask = state.doneWhen = state.resumeAt = '';
      ['focusTask', 'doneWhen', 'resumeAt'].forEach(id => $(id).value = '');
      save('完成了'); $('finishDialog').close();
    });
  </script>
</body>
</html>
